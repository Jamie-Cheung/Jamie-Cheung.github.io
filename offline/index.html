<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Zhanjie Zhang - Homepage</title>
    <link rel="stylesheet" href="stylesheet.css">
  </head>
  <body>
    <main class="offline">
      <h1>主页暂未公开</h1>
      <p>This homepage is temporarily offline.</p>
      <p>如需联系，请发送邮件至 <a href="mailto:zhangzhanj@126.com">zhangzhanj@126.com</a>。</p>

      <form class="offline__form" id="owner-unlock">
        <label class="offline__label" for="owner-unlock-key">请输入密码</label>
        <div class="offline__row">
          <input
            id="owner-unlock-key"
            name="preview"
            type="password"
            autocomplete="current-password"
            spellcheck="false"
            autofocus
          >
          <button type="submit">进入主页</button>
        </div>
        <p class="offline__hint">输入正确密码后，这台电脑会记住，下次可直接进入。</p>
        <p class="offline__error" id="owner-unlock-error" hidden></p>
      </form>
    </main>
    <script src="owner-preview.js"></script>
  </body>
</html>
