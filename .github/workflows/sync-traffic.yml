name: Sync traffic stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync GitHub traffic data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/sync_traffic.py

      - name: Commit traffic data
        run: |
          if git diff --quiet -- data/traffic.json; then
            echo "Traffic data unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic.json
          git commit -m "Update traffic stats"
          git push

      - name: Decide publish mode
        id: mode
        run: |
          published=$(python3 -c "import json; print('true' if json.load(open('site-config.json')).get('published', True) else 'false')")
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: |
          mkdir -p _site
          if [ "${{ steps.mode.outputs.published }}" = "true" ]; then
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='offline' \
              --exclude='site-config.json' \
              --exclude='README.md' \
              ./ _site/
          else
            cp offline/index.html _site/index.html
            cp offline/stylesheet.css _site/stylesheet.css
            touch _site/.nojekyll
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
